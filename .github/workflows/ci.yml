name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 26.13.1 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - name: Install locked dependencies and build package
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit and protocol tests
        run: npm test
      - name: Pack and identify the exact plugin used by host checks
        shell: pwsh
        run: |
          $package = npm pack --ignore-scripts --json --pack-destination "$env:RUNNER_TEMP" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarball = Join-Path $env:RUNNER_TEMP $package.filename
          Get-FileHash -LiteralPath $tarball -Algorithm SHA256 | Format-List
          "DOCWEN_DSH_TEST_PACKAGE=$tarball" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify and unpack published DocWen 0.23.2
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'docwen-core-0.23.2'
          $null = New-Item -ItemType Directory -Path $root
          if ($IsWindows) {
            $asset = 'DocWen-windows-x64.zip'
            $sha256 = '8a93eaccb5cde346f594e9c77aeb91cc11fe2f559d39eef765cfdec44ae94ee1'
            $name = 'DocWenCLI.exe'
          } else {
            $asset = 'DocWenCLI-0.23.2-linux-x64.tar.gz'
            $sha256 = '35e7eae157b57f65e5ee41ae99dd6169a3eeda77003baf9378519a078c2b3160'
            $name = 'DocWenCLI'
          }
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/ZHYX91/docwen/releases/download/0.23.2/$asset" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $sha256) {
            throw 'The DocWen release archive digest does not match the pinned distribution.'
          }
          if ($IsWindows) { python -m zipfile -e $archive $root }
          else { tar -xf $archive -C $root }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaries = @(Get-ChildItem -LiteralPath $root -File -Recurse -Filter $name)
          if ($binaries.Count -ne 1) { throw 'The DocWen release must contain exactly one CLI executable.' }
          "DOCWEN_DSH_EXECUTABLE=$($binaries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the released DSH host
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/docwen-test-host" --no-audit --no-fund @deepseek-ai/dsh@0.2.3-alpha.2 pnpm@11.28.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/docwen-test-host/node_modules/.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DSH_BIN=$env:RUNNER_TEMP/docwen-test-host/node_modules/@deepseek-ai/dsh/lib/bin.js" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install and exercise the packaged plugin in a disposable DSH profile
        run: node scripts/host-smoke.mjs
      - name: Exercise the installed DSH session panel in Chromium
        shell: pwsh
        run: |
          $ui = Join-Path $env:RUNNER_TEMP 'docwen-test-browser'
          npm install --prefix $ui --no-audit --no-fund --save-exact playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $playwright = Join-Path $ui 'node_modules/playwright/cli.js'
          if ($IsWindows) { node $playwright install chromium }
          else { node $playwright install --with-deps chromium }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $ui 'node_modules'
          node scripts/browser-smoke.mjs
